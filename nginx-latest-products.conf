# Добавить внутрь server { ... } для kavistore.org
location = /latest-products.json {
    root /var/www/kavistore;
    try_files /latest-products.json =404;
    add_header Access-Control-Allow-Origin "https://kavistore.online" always;
    add_header Vary "Origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
